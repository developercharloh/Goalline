openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication and profile
  - name: admin
    description: Admin-only profile and tip management
paths:
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthAction" }
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      responses:
        "200":
          description: Current account session, if any
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
  /auth/profile:
    patch:
      operationId: updateAccountProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated account profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/link-legacy:
    post:
      operationId: linkLegacyAccount
      tags: [auth]
      responses:
        "200":
          description: Existing authenticated Clerk-owned data linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLinkResult" }
  /auth/admin/bootstrap:
    post:
      operationId: bootstrapAdmin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBootstrapInput" }
      responses:
        "200":
          description: Initial admin access granted once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Matching user profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/tip-packages:
    get:
      operationId: getAdminTipPackages
      tags: [admin]
      responses:
        "200":
          description: The three fixed weekly VIP packages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTipPackage" }
  /admin/tip-packages/{id}:
    patch:
      operationId: updateAdminTipPackage
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTipPackageInput" }
      responses:
        "200":
          description: Tip package updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTipPackage" }
  /admin/tip-entries/{id}/result:
    patch:
      operationId: updateAdminTipEntryResult
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchResultInput" }
      responses:
        "200":
          description: Match result updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMatchResult" }
  /probet/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /probet/wallet:
    get:
      operationId: getWallet
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /probet/transactions:
    get:
      operationId: getTransactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
  /probet/tips:
    get:
      operationId: getTips
      responses:
        "200":
          description: Tip packages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TipPackage" }
  /probet/purchases:
    post:
      operationId: purchaseTips
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "200":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResult" }
  /probet/deposits:
    post:
      operationId: createCashiaDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositInput" }
      responses:
        "201":
          description: Cashia staging checkout session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositCheckout" }
  /probet/deposits/{requestId}:
    get:
      operationId: getCashiaDepositStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: Current Cashia deposit status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositStatus" }
  /probet/payhero/config:
    get:
      operationId: getPayheroConfig
      responses:
        "200":
          description: PayHero M-Pesa Express availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroConfig" }
  /probet/payhero/deposits:
    post:
      operationId: createPayheroDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayheroDepositInput" }
      responses:
        "201":
          description: PayHero M-Pesa STK push initiated or awaiting confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroDepositStatus" }
  /probet/payhero/deposits/{requestId}:
    get:
      operationId: getPayheroDepositStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current PayHero payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroDepositStatus" }
  /probet/manual-deposits/config:
    get:
      operationId: getManualDepositConfig
      responses:
        "200":
          description: Manual M-Pesa availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDepositConfig" }
  /probet/manual-deposits:
    get:
      operationId: getManualDeposits
      responses:
        "200":
          description: This wallet's deposit requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManualDeposit" }
    post:
      operationId: submitManualDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualDepositInput" }
      responses:
        "201":
          description: Submitted for review without crediting the wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/manual-deposits/reviews:
    get:
      operationId: getManualDepositReviews
      responses:
        "200":
          description: Authorised review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/manual-deposits/{id}/review:
    post:
      operationId: reviewManualDeposit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualDepositReview" }
      responses:
        "200":
          description: Recorded decision and credited once if approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/chat:
    get:
      operationId: getChat
      responses:
        "200":
          description: Recent public community messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "201":
          description: Community message posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Account:
      type: object
      required: [id, email, username, fullName, phone, country, role, legacyLinked]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        fullName: { type: string }
        phone: { type: string }
        country: { type: string }
        role: { type: string, enum: [user, admin] }
        legacyLinked: { type: boolean }
    AuthSession:
      type: object
      required: [account]
      properties:
        account: { $ref: "#/components/schemas/Account" }
    AuthMe:
      type: object
      required: [account, legacySession]
      properties:
        account: { oneOf: [{ $ref: "#/components/schemas/Account" }, { type: "null" }] }
        legacySession: { type: boolean }
    AuthAction:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    AccountLinkResult:
      type: object
      required: [linked, message]
      properties:
        linked: { type: boolean }
        message: { type: string }
    SignUpInput:
      type: object
      required: [email, password, confirmPassword, username, fullName, phone, country]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 4, maxLength: 128 }
        confirmPassword: { type: string, minLength: 4, maxLength: 128 }
        username: { type: string, minLength: 3, maxLength: 24, pattern: "^[a-zA-Z0-9_]+$" }
        fullName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 7, maxLength: 24 }
        country: { type: string, minLength: 2, maxLength: 80 }
    SignInInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ProfileInput:
      type: object
      required: [username, fullName, phone, country]
      properties:
        username: { type: string, minLength: 3, maxLength: 24, pattern: "^[a-zA-Z0-9_]+$" }
        fullName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 7, maxLength: 24 }
        country: { type: string, minLength: 2, maxLength: 80 }
    AdminBootstrapInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 12, maxLength: 256 }
    AdminUser:
      type: object
      required: [id, email, username, fullName, phone, country, role, createdAt, legacyLinked]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        fullName: { type: string }
        phone: { type: string }
        country: { type: string }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
        legacyLinked: { type: boolean }
    AdminTipPackage:
      type: object
      required: [id, title, description, price, status, isSample, matches, matchCount, totalOdds, stakeLevel, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        status: { type: string, enum: [draft, published, archived] }
        isSample: { type: boolean }
        matchCount: { type: integer }
        totalOdds: { type: number, minimum: 1, maximum: 1000000000 }
        stakeLevel: { type: string, enum: [medium, high] }
        matches:
          type: array
          items: { $ref: "#/components/schemas/AdminMatch" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminTipPackageInput:
      type: object
      required: [totalOdds, stakeLevel, matches]
      properties:
        totalOdds: { type: number, minimum: 1, maximum: 1000000000, multipleOf: 0.01 }
        stakeLevel: { type: string, enum: [medium, high] }
        matches:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/MatchInput" }
    Wallet:
      type: object
      required: [balance, currency, isDemo, paymentsEnabled, provider]
      properties:
        balance: { type: number }
        currency: { type: string }
        isDemo: { type: boolean }
        paymentsEnabled: { type: boolean }
        provider: { type: string }
        stagingCheckoutEnabled: { type: boolean }
        depositedBalance: { type: number }
    Transaction:
      type: object
      required: [id, title, amount, type, createdAt, isDemo]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        type: { type: string, enum: [topup, purchase] }
        createdAt: { type: string }
        isDemo: { type: boolean }
    Match:
      type: object
      required: [matchDate, kickoff, homeTeam, awayTeam, selection, odds, result]
      properties:
        matchDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        kickoff: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        homeTeam: { type: string, minLength: 1, maxLength: 120 }
        awayTeam: { type: string, minLength: 1, maxLength: 120 }
        selection: { type: string, minLength: 1, maxLength: 120 }
        odds: { type: number, minimum: 1.01, maximum: 100000, multipleOf: 0.01 }
        result: { $ref: "#/components/schemas/MatchResult" }
    AdminMatch:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    MatchInput:
      type: object
      required: [matchDate, kickoff, homeTeam, awayTeam, selection, odds]
      properties:
        id: { type: string, format: uuid }
        matchDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        kickoff: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        homeTeam: { type: string, minLength: 1, maxLength: 120 }
        awayTeam: { type: string, minLength: 1, maxLength: 120 }
        selection: { type: string, minLength: 1, maxLength: 120 }
        odds: { type: number, minimum: 1.01, maximum: 100000, multipleOf: 0.01 }
    MatchResult:
      type: string
      enum: [pending, won, lost]
    MatchResultInput:
      type: object
      required: [result]
      properties:
        result: { $ref: "#/components/schemas/MatchResult" }
    AdminMatchResult:
      type: object
      required: [id, result]
      properties:
        id: { type: string, format: uuid }
        result: { $ref: "#/components/schemas/MatchResult" }
    TipPackage:
      type: object
      required: [id, title, description, price, purchased, accessExpiresAt, isSample, matches, matchCount, totalOdds, stakeLevel]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        purchased: { type: boolean }
        accessExpiresAt: { type: ["string", "null"], format: date-time }
        isSample: { type: boolean }
        matchCount: { type: integer }
        totalOdds: { type: number, minimum: 1, maximum: 1000000000 }
        stakeLevel: { type: string, enum: [medium, high] }
        matches:
          type: array
          items: { $ref: "#/components/schemas/Match" }
    Dashboard:
      type: object
      required: [wallet, packages, recentTransactions, purchasedCount]
      properties:
        wallet: { $ref: "#/components/schemas/Wallet" }
        packages:
          type: array
          items: { $ref: "#/components/schemas/TipPackage" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        purchasedCount: { type: integer }
    PurchaseInput:
      type: object
      required: [packageId]
      properties:
        packageId: { type: string, minLength: 1 }
    PurchaseResult:
      type: object
      required: [success, balance, packageId, isDemo]
      properties:
        success: { type: boolean }
        balance: { type: number }
        packageId: { type: string }
        isDemo: { type: boolean }
    DepositInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 1, maximum: 100000, multipleOf: 0.01 }
    DepositCheckout:
      type: object
      required: [requestId, checkoutUrl, amount, currency]
      properties:
        requestId: { type: string }
        checkoutUrl: { type: string, format: uri }
        isTest: { type: boolean }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
    DepositStatus:
      type: object
      required: [requestId, status, amount, currency, message, balance]
      properties:
        requestId: { type: string }
        status: { type: string, enum: [pending, credited, failed] }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
        message: { type: string }
        balance: { type: ["number", "null"] }
    PayheroConfig:
      type: object
      required: [enabled, message, channelId]
      properties:
        enabled: { type: boolean }
        message: { type: string }
        channelId: { type: ["integer", "null"] }
    PayheroDepositInput:
      type: object
      required: [amount, phoneNumber]
      properties:
        amount: { type: integer, minimum: 1, maximum: 100000 }
        phoneNumber: { type: string, minLength: 9, maxLength: 13 }
    PayheroDepositStatus:
      type: object
      required: [requestId, status, amount, currency, message, balance]
      properties:
        requestId: { type: string }
        status: { type: string, enum: [pending, credited, failed] }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
        message: { type: string }
        balance: { type: ["number", "null"] }
    ManualDepositConfig:
      type: object
      required: [enabled, tillNumber, businessName, message]
      properties:
        enabled: { type: boolean }
        tillNumber: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        message: { type: string }
    ManualDepositInput:
      type: object
      required: [amount, firstName, lastName, mpesaMessage]
      properties:
        amount: { type: number, minimum: 1, maximum: 100000, multipleOf: 0.01 }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        mpesaMessage: { type: string, minLength: 20, maxLength: 3000 }
    ManualDepositReview:
      type: object
      required: [decision, note, verified]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, minLength: 3, maxLength: 500 }
        verified: { type: boolean }
    ManualDeposit:
      type: object
      required: [id, amount, firstName, lastName, mpesaMessage, receiptCode, tillNumber, businessName, status, note, createdAt, reviewedAt]
      properties:
        id: { type: string }
        amount: { type: number }
        firstName: { type: string }
        lastName: { type: string }
        mpesaMessage: { type: string }
        receiptCode: { type: string }
        tillNumber: { type: string }
        businessName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
    ChatInput:
      type: object
      required: [displayName, content]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 24 }
        content: { type: string, minLength: 1, maxLength: 500 }
    ChatMessage:
      type: object
      required: [id, displayName, content, createdAt, isMine]
      properties:
        id: { type: string }
        displayName: { type: string }
        content: { type: string }
        createdAt: { type: string }
        isMine: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

