openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /probet/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /probet/wallet:
    get:
      operationId: getWallet
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /probet/transactions:
    get:
      operationId: getTransactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
  /probet/tips:
    get:
      operationId: getTips
      responses:
        "200":
          description: Tip packages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TipPackage" }
  /probet/purchases:
    post:
      operationId: purchaseTips
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "200":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResult" }
  /probet/deposits:
    post:
      operationId: createCashiaDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositInput" }
      responses:
        "201":
          description: Cashia staging checkout session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositCheckout" }
  /probet/deposits/{requestId}:
    get:
      operationId: getCashiaDepositStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: Current Cashia deposit status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositStatus" }
  /probet/payhero/config:
    get:
      operationId: getPayheroConfig
      responses:
        "200":
          description: PayHero M-Pesa Express availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroConfig" }
  /probet/payhero/deposits:
    post:
      operationId: createPayheroDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayheroDepositInput" }
      responses:
        "201":
          description: M-Pesa STK payment initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroDepositStatus" }
  /probet/payhero/deposits/{requestId}:
    get:
      operationId: getPayheroDepositStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current PayHero payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayheroDepositStatus" }
  /probet/manual-deposits/config:
    get:
      operationId: getManualDepositConfig
      responses:
        "200":
          description: Manual M-Pesa availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDepositConfig" }
  /probet/manual-deposits:
    get:
      operationId: getManualDeposits
      responses:
        "200":
          description: This wallet's deposit requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManualDeposit" }
    post:
      operationId: submitManualDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualDepositInput" }
      responses:
        "201":
          description: Submitted for review without crediting the wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/manual-deposits/reviews:
    get:
      operationId: getManualDepositReviews
      responses:
        "200":
          description: Authorised review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/manual-deposits/{id}/review:
    post:
      operationId: reviewManualDeposit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualDepositReview" }
      responses:
        "200":
          description: Recorded decision and credited once if approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualDeposit" }
  /probet/chat:
    get:
      operationId: getChat
      responses:
        "200":
          description: Recent public community messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "201":
          description: Community message posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Wallet:
      type: object
      required: [balance, currency, isDemo, paymentsEnabled, provider]
      properties:
        balance: { type: number }
        currency: { type: string }
        isDemo: { type: boolean }
        paymentsEnabled: { type: boolean }
        provider: { type: string }
        stagingCheckoutEnabled: { type: boolean }
        depositedBalance: { type: number }
    Transaction:
      type: object
      required: [id, title, amount, type, createdAt, isDemo]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        type: { type: string, enum: [topup, purchase] }
        createdAt: { type: string }
        isDemo: { type: boolean }
    Tip:
      type: object
      required: [match, prediction, league]
      properties:
        match: { type: string }
        prediction: { type: string }
        league: { type: string }
    TipPackage:
      type: object
      required: [id, title, description, price, purchased, isSample, tips, matchCount]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        purchased: { type: boolean }
        isSample: { type: boolean }
        matchCount: { type: integer }
        tips:
          type: array
          items: { $ref: "#/components/schemas/Tip" }
    Dashboard:
      type: object
      required: [wallet, packages, recentTransactions, purchasedCount]
      properties:
        wallet: { $ref: "#/components/schemas/Wallet" }
        packages:
          type: array
          items: { $ref: "#/components/schemas/TipPackage" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        purchasedCount: { type: integer }
    PurchaseInput:
      type: object
      required: [packageId]
      properties:
        packageId: { type: string, minLength: 1 }
    PurchaseResult:
      type: object
      required: [success, balance, packageId, isDemo]
      properties:
        success: { type: boolean }
        balance: { type: number }
        packageId: { type: string }
        isDemo: { type: boolean }
    DepositInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 1, maximum: 100000, multipleOf: 0.01 }
    DepositCheckout:
      type: object
      required: [requestId, checkoutUrl, amount, currency]
      properties:
        requestId: { type: string }
        checkoutUrl: { type: string, format: uri }
        isTest: { type: boolean }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
    DepositStatus:
      type: object
      required: [requestId, status, amount, currency, message, balance]
      properties:
        requestId: { type: string }
        status: { type: string, enum: [pending, credited, failed] }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
        message: { type: string }
        balance: { type: ["number", "null"] }
    PayheroConfig:
      type: object
      required: [enabled, message]
      properties:
        enabled: { type: boolean }
        message: { type: string }
    PayheroDepositInput:
      type: object
      required: [amount, phoneNumber]
      properties:
        amount: { type: integer, minimum: 1, maximum: 100000 }
        phoneNumber: { type: string, minLength: 9, maxLength: 13 }
    PayheroDepositStatus:
      type: object
      required: [requestId, status, amount, currency, message, balance]
      properties:
        requestId: { type: string }
        status: { type: string, enum: [pending, credited, failed] }
        amount: { type: number }
        currency: { type: string, enum: [KES] }
        message: { type: string }
        balance: { type: ["number", "null"] }
    ManualDepositConfig:
      type: object
      required: [enabled, tillNumber, businessName, message]
      properties:
        enabled: { type: boolean }
        tillNumber: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        message: { type: string }
    ManualDepositInput:
      type: object
      required: [amount, firstName, lastName, mpesaMessage]
      properties:
        amount: { type: number, minimum: 1, maximum: 100000, multipleOf: 0.01 }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        mpesaMessage: { type: string, minLength: 20, maxLength: 3000 }
    ManualDepositReview:
      type: object
      required: [decision, note, verified]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, minLength: 3, maxLength: 500 }
        verified: { type: boolean }
    ManualDeposit:
      type: object
      required: [id, amount, firstName, lastName, mpesaMessage, receiptCode, tillNumber, businessName, status, note, createdAt, reviewedAt]
      properties:
        id: { type: string }
        amount: { type: number }
        firstName: { type: string }
        lastName: { type: string }
        mpesaMessage: { type: string }
        receiptCode: { type: string }
        tillNumber: { type: string }
        businessName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
    ChatInput:
      type: object
      required: [displayName, content]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 24 }
        content: { type: string, minLength: 1, maxLength: 500 }
    ChatMessage:
      type: object
      required: [id, displayName, content, createdAt, isMine]
      properties:
        id: { type: string }
        displayName: { type: string }
        content: { type: string }
        createdAt: { type: string }
        isMine: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

